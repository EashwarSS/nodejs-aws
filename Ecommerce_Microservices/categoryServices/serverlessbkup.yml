# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: macaulayfamous
# "service" is the name of this project. This will also be added to your AWS resource names.
service: categoryService

provider:
  name: aws
  runtime: nodejs22.x
  environment:
    BUCKET_NAME: category-images-macaulay-famous-dev-123z-new
    DYNAMO_TABLE: Categories
  iamRoleStatements:
    - Effect: 'Allow'
      Action:
        -  s3:PutObject
      Resource: arn:aws:s3:::category-images-macaulay-famous-dev-123z-new/*
    - Effect: 'Allow'
      Action:
        -  dynamodb:PutItem
        -  dynamodb:UpdateItem
        -  dynamodb:Scan
        -  dynamodb:DeleteItem
      Resource: arn:aws:dynamodb:us-east-1:294659523434:table/Categories
  
  # Uncomment to easily set up a custom domain. Read the docs for more details:
  # https://www.serverless.com/framework/docs/providers/aws/guide/domains
  # domain: api.example.com
resources:
  Resources:
    CategoryImagesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: category-images-macaulay-famous-dev-123z-new
    CategoryTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Categories
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          -  AttributeName: fileName
             AttributeType: S
        KeySchema:
          -  AttributeName: fileName
             KeyType: HASH  
    CategoryCleanupTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: CategoryCleanupTopic
    CategoryCleanupSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn:
          Ref: CategoryCleanupTopic
        Protocol: email
        Endpoint:    eashwar@gmail.com
    
functions:
  getUploadUrl:
    handler: handlers/getUploadUrl.getUploadUrl
    events:
      - httpApi:
          path: /upload-url
          method: post
  updateCategoryImage:
    handler: handlers/updateCategoryImage.updateCategoryImage
    events:
      -  s3:
           bucket: category-images-macaulay-famous-dev-123z-new
           event: s3:ObjectCreated:Put
           existing: true
  cleanupCategories:
    handler: handlers/cleanupCategories.cleanupCategories
    events:
      -  schedule: rate(2 minutes)