# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: bumblebee09
# "service" is the name of this project. This will also be added to your AWS resource names.
service: orderService

provider:
  name: aws
  runtime: nodejs24.x
  region: us-east-1
  environment:
    ORDERS_TABLE: Orders
    SQS_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/294659523434/OrderQueue
  iamRoleStatements:
    - Effect: 'Allow'
      Action:
        - 'dynamodb:PutItem'
        - 'sqs:SendMessage'
        - 'sqs:ReceiveMessage'
        - 'sqs:DeleteMessage'
        - 'ses:SendEmail'
      Resource:  
        - Fn::GetAtt: [OrdersTable, Arn]
        - Fn::GetAtt: [OrdersQueue, Arn]
        - Fn::GetAtt: [OrderServiceEmailIdentity, Arn] 
        

resources:
  Resources:
    OrdersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Orders
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          -  AttributeName: id
             AttributeType: S
        KeySchema:
          -  AttributeName: id
             KeyType: HASH  
    OrdersQueue:
      Type: AWS::SQS::Queue
      Properties: 
        QueueName: OrderQueue
    OrderServiceEmailIdentity:
      Type: AWS::SES::EmailIdentity
      Properties:
        EmailIdentity: "eashwar@gmail.com"
functions:
  placeOrder:
    handler: handlers/placeOrder.placeOrder
    events:
      - httpApi:
          path: /place-order
          method: post
  processOrder:
    handler: handlers/processOrder.processOrder
    events:        
      -  sqs:
           arn:
             Fn::GetAtt: [OrdersQueue, Arn]
  signIn:
    handler: handlers/signIn.signIn
    events:
      - httpApi:
          path: /sign-in
          method: post           
  signOut:
    handler: handlers/signOut.signOut
    events:
      - httpApi:
          path: /sign-out
          method: post
  resetPassword:
    handler: handlers/forgotPassword.forgotPassword
    events:
      - httpApi: 
          path: /initiate-forgotPassword
          method: post
  confirmForgotPassword:
    handler: handlers/confirmForgotPassword.confirmForgotPassword
    events:
      - httpApi: 
          path: /reset-password
          method: post                         
             
             
